<svg viewBox="0 0 1000 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Shield background with watermark transparency -->
  <g opacity="0.35">
    <!-- Outer shield outline -->
    <path d="M 120 40 L 180 80 L 180 140 C 180 165, 150 190, 120 200 C 90 190, 60 165, 60 140 L 60 80 Z" fill="none" stroke="#0369a1" stroke-width="8" stroke-linejoin="round"/>

    <!-- Shield fill - gradient blue -->
    <defs>
      <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#0369a1;stop-opacity:1" />
      </linearGradient>
      <linearGradient id="dropGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#0284c7;stop-opacity:1" />
      </linearGradient>
    </defs>

    <path d="M 120 40 L 180 80 L 180 140 C 180 165, 150 190, 120 200 C 90 190, 60 165, 60 140 L 60 80 Z" fill="url(#shieldGrad)" stroke="#0369a1" stroke-width="6" stroke-linejoin="round"/>

    <!-- Water droplet inside shield -->
    <path d="M 120 65 C 120 65, 100 85, 100 100 C 100 115, 108 128, 120 128 C 132 128, 140 115, 140 100 C 140 85, 120 65, 120 65 Z" fill="url(#dropGrad)" />

    <!-- Droplet highlight -->
    <ellipse cx="112" cy="80" rx="6" ry="10" fill="white" opacity="0.5" />

    <!-- Checkmark -->
    <path d="M 128 105 L 135 115 L 145 95" stroke="white" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />
  </g>

  <!-- Text: WATER SOFTENER -->
  <text x="240" y="95" font-family="Arial, sans-serif" font-size="58" font-weight="bold" fill="#001f3f" letter-spacing="-1">
    WATER
  </text>
  <text x="240" y="155" font-family="Arial, sans-serif" font-size="58" font-weight="bold" fill="#001f3f" letter-spacing="-1">
    SOFTENER
  </text>

  <!-- Text: OF TAMPA -->
  <text x="240" y="185" font-family="Arial, sans-serif" font-size="32" font-weight="600" fill="#0ea5e9" letter-spacing="1">
    OF TAMPA
  </text>
</svg>